# Transcendentals go through the pure-Rust `libm` crate, never the host C libm:
# glibc picks its exp/log/pow/sin/cos code path per CPU (FMA/AVX2), so the
# last bits of every number would depend on the machine.  sqrt (IEEE-exact)
# and powi (multiplication) are fine and not listed.
disallowed-methods = [
  { path = "f64::exp", reason = "use libm::exp (host-independent)" },
  { path = "f64::exp2", reason = "use libm::exp2" },
  { path = "f64::exp_m1", reason = "use libm::expm1" },
  { path = "f64::ln", reason = "use libm::log" },
  { path = "f64::ln_1p", reason = "use libm::log1p" },
  { path = "f64::log", reason = "use libm::log(x) / libm::log(b)" },
  { path = "f64::log2", reason = "use libm::log2" },
  { path = "f64::log10", reason = "use libm::log10" },
  { path = "f64::powf", reason = "use libm::pow" },
  { path = "f64::sin", reason = "use libm::sin" },
  { path = "f64::cos", reason = "use libm::cos" },
  { path = "f64::sin_cos", reason = "use libm::sin and libm::cos" },
  { path = "f64::tan", reason = "use libm::tan" },
  { path = "f64::asin", reason = "use libm::asin" },
  { path = "f64::acos", reason = "use libm::acos" },
  { path = "f64::atan", reason = "use libm::atan" },
  { path = "f64::atan2", reason = "use libm::atan2" },
  { path = "f64::sinh", reason = "use libm::sinh" },
  { path = "f64::cosh", reason = "use libm::cosh" },
  { path = "f64::tanh", reason = "use libm::tanh" },
  { path = "f64::cbrt", reason = "use libm::cbrt" },
  { path = "f64::hypot", reason = "use libm::hypot" },
  { path = "f32::exp", reason = "use libm::expf" },
  { path = "f32::ln", reason = "use libm::logf" },
  { path = "f32::log2", reason = "use libm::log2f" },
  { path = "f32::log10", reason = "use libm::log10f" },
  { path = "f32::powf", reason = "use libm::powf" },
  { path = "f32::sin", reason = "use libm::sinf" },
  { path = "f32::cos", reason = "use libm::cosf" },
  { path = "f32::tan", reason = "use libm::tanf" },
  { path = "f32::atan2", reason = "use libm::atan2f" },
  { path = "f32::exp_m1", reason = "use libm::expm1f" },
  { path = "f32::ln_1p", reason = "use libm::log1pf" },
  { path = "f32::tanh", reason = "use libm::tanhf" },
  { path = "f32::cbrt", reason = "use libm::cbrtf" },
  { path = "f32::hypot", reason = "use libm::hypotf" },
  { path = "num_complex::Complex::norm", reason = "calls f64::hypot; use libm::hypot(re, im)" },
  { path = "num_complex::Complex::arg", reason = "calls f64::atan2" },
  { path = "num_complex::Complex::from_polar", reason = "calls f64::sin/cos" },
  { path = "num_complex::Complex::exp", reason = "calls f64::exp/sin/cos" },
  { path = "num_complex::Complex::ln", reason = "calls f64::ln/atan2" },
]
