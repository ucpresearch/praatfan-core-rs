# Transcendentals go through `crate::math` (src/math.rs): the pure-Rust `libm`
# crate by default (host-independent last bits), or the platform C library
# under the opt-in `system-libm` feature (Praat's last bits on the same host).
# std's f64 methods always call the host C libm, so they are banned, and so are
# direct `libm::` calls, which would bypass the feature.  sqrt, floor, ceil,
# round and fma (exactly rounded) and powi (multiplication) are fine.
disallowed-methods = [
  { path = "libm::sin", reason = "use crate::math::sin (honours system-libm)" },
  { path = "libm::cos", reason = "use crate::math::cos (honours system-libm)" },
  { path = "libm::exp", reason = "use crate::math::exp (honours system-libm)" },
  { path = "libm::log", reason = "use crate::math::log (honours system-libm)" },
  { path = "libm::log2", reason = "use crate::math::log2 (honours system-libm)" },
  { path = "libm::log10", reason = "use crate::math::log10 (honours system-libm)" },
  { path = "libm::pow", reason = "use crate::math::pow (honours system-libm)" },
  { path = "libm::hypot", reason = "use crate::math::hypot (honours system-libm)" },
  { path = "libm::atan2", reason = "use crate::math::atan2 (honours system-libm)" },
  { path = "libm::sinh", reason = "use crate::math::sinh (honours system-libm)" },
  { path = "f64::exp", reason = "use crate::math::exp (host-independent)" },
  { path = "f64::exp2", reason = "use crate::math::exp2" },
  { path = "f64::exp_m1", reason = "use crate::math::expm1" },
  { path = "f64::ln", reason = "use crate::math::log" },
  { path = "f64::ln_1p", reason = "use crate::math::log1p" },
  { path = "f64::log", reason = "use crate::math::log(x) / libm::log(b)" },
  { path = "f64::log2", reason = "use crate::math::log2" },
  { path = "f64::log10", reason = "use crate::math::log10" },
  { path = "f64::powf", reason = "use crate::math::pow" },
  { path = "f64::sin", reason = "use crate::math::sin" },
  { path = "f64::cos", reason = "use crate::math::cos" },
  { path = "f64::sin_cos", reason = "use crate::math::sin and crate::math::cos" },
  { path = "f64::tan", reason = "use crate::math::tan" },
  { path = "f64::asin", reason = "use crate::math::asin" },
  { path = "f64::acos", reason = "use crate::math::acos" },
  { path = "f64::atan", reason = "use crate::math::atan" },
  { path = "f64::atan2", reason = "use crate::math::atan2" },
  { path = "f64::sinh", reason = "use crate::math::sinh" },
  { path = "f64::cosh", reason = "use crate::math::cosh" },
  { path = "f64::tanh", reason = "use crate::math::tanh" },
  { path = "f64::cbrt", reason = "use crate::math::cbrt" },
  { path = "f64::hypot", reason = "use crate::math::hypot" },
  { path = "f32::exp", reason = "use libm::expf (no f32 in crate::math)" },
  { path = "f32::ln", reason = "use libm::logf (no f32 in crate::math)" },
  { path = "f32::log2", reason = "use libm::log2f (no f32 in crate::math)" },
  { path = "f32::log10", reason = "use libm::log10f (no f32 in crate::math)" },
  { path = "f32::powf", reason = "use libm::powf (no f32 in crate::math)" },
  { path = "f32::sin", reason = "use libm::sinf (no f32 in crate::math)" },
  { path = "f32::cos", reason = "use libm::cosf (no f32 in crate::math)" },
  { path = "f32::tan", reason = "use libm::tanf (no f32 in crate::math)" },
  { path = "f32::atan2", reason = "use libm::atan2f (no f32 in crate::math)" },
  { path = "f32::exp_m1", reason = "use libm::expm1f (no f32 in crate::math)" },
  { path = "f32::ln_1p", reason = "use libm::log1pf (no f32 in crate::math)" },
  { path = "f32::tanh", reason = "use libm::tanhf (no f32 in crate::math)" },
  { path = "f32::cbrt", reason = "use libm::cbrtf (no f32 in crate::math)" },
  { path = "f32::hypot", reason = "use libm::hypotf (no f32 in crate::math)" },
  { path = "num_complex::Complex::norm", reason = "calls f64::hypot; use libm::hypot(re, im)" },
  { path = "num_complex::Complex::arg", reason = "calls f64::atan2" },
  { path = "num_complex::Complex::from_polar", reason = "calls f64::sin/cos" },
  { path = "num_complex::Complex::exp", reason = "calls f64::exp/sin/cos" },
  { path = "num_complex::Complex::ln", reason = "calls f64::ln/atan2" },
]
