[package]
name = "praatfan-gpl"
version = "0.1.16"
edition = "2021"
authors = ["Uriel Cohen Priva <uriel_cohen_priva@brown.edu>"]
license = "GPL-3.0"
description = "praatfan-gpl: WebAssembly bindings for praatfan-core-rs acoustic analysis library"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook", "decode"]
# Sound.from_bytes_channels: decode audio files with our own decoders, at the
# file's own rate (the browser's decodeAudioData resamples).
decode = ["praatfan-core-rs/decode"]
# JSON pipe entry points (version, pipe_request_bytes, pipe_request_samples)
# for the embedded-V8 bundle. Build that bundle without default features so
# nothing touches `console`.
pipe = ["praatfan-core-rs/pipe-core", "decode"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

# Core library without file I/O features
praatfan-core-rs = { path = "..", default-features = false }

# For serde support in WASM
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"  # Optimize for size
lto = true
