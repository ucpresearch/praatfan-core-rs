[package]
name = "praatfan-core-python"
version = "0.1.16"
edition = "2021"
authors = ["Uriel Cohen Priva <uriel_cohen_priva@brown.edu>"]
license = "GPL-3.0"
description = "Python bindings for praatfan-core-rs acoustic analysis library"

[lib]
name = "praatfan_gpl"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
praatfan-core-rs = { path = "..", features = ["parallel"] }

[features]
# Praat's last bits on Linux/glibc hosts; see ../src/math.rs.
system-libm = ["praatfan-core-rs/system-libm"]
