[package]
name = "praatfan-core-rs"
version = "0.1.9"
edition = "2021"
license = "GPL-3.0"
description = "Rust reimplementation of Praat's core acoustic analysis algorithms"
repository = "https://github.com/ucpresearch/praatfan-core-rs"
keywords = ["audio", "speech", "acoustics", "praat", "signal-processing"]
categories = ["multimedia::audio", "science"]

[features]
default = ["file-io"]
# File I/O support - disable for WASM builds
file-io = ["dep:hound", "dep:symphonia", "dep:desphere"]
# Multi-threaded frame computation - disable for WASM builds
parallel = ["dep:rayon"]
# JSON stdin → JSON stdout interface for R / shell / other languages.
# Build with: cargo build --release --features pipe --bin praatfan-gpl-pipe
pipe = ["dep:serde", "dep:serde_json", "file-io"]

[dependencies]
ndarray = "0.15"
rustfft = "6.1"
num-complex = "0.4"
thiserror = "1.0"
nalgebra = "0.33"
# High-precision Hessenberg + Francis QR eigendecomposition (pure Rust,
# WASM-compatible). We disable default features (rayon, sparse-linalg, rand,
# npy) to keep the dep minimal and WASM-friendly; only `std` + `linalg` are
# required for real-matrix eigendecomposition.
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }

# File I/O dependencies (optional for WASM compatibility)
hound = { version = "3.5", optional = true }
symphonia = { version = "0.5", features = ["mp3", "ogg", "flac", "wav", "pcm", "vorbis"], optional = true }
# NIST SPHERE (incl. shorten-compressed) decoder, used only as a fallback in
# Sound::from_file when symphonia/hound cannot decode the file. MIT-licensed,
# dependency-free core; tag-pinned git dep (not on crates.io by design — its
# repo-root virtual workspace exposes the crate from the rust/ subdirectory).
desphere = { git = "https://github.com/ucpresearch/desphere", tag = "v0.1.0", optional = true }

# Parallelism (optional for WASM compatibility)
rayon = { version = "1.10", optional = true }

# Pipe interface (optional, enabled with "pipe" feature)
serde = { version = "1.0", features = ["derive"], optional = true }
# float_roundtrip: exact f64 parsing, so request "times" (and test round-trips)
# are bit-faithful; serialization is already exact-shortest via ryu.
serde_json = { version = "1.0", features = ["float_roundtrip"], optional = true }

[dev-dependencies]
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "praatfan_core"
path = "src/lib.rs"

[[bin]]
name = "praatfan-gpl-pipe"
path = "src/bin/praatfan_gpl_pipe.rs"
required-features = ["pipe"]

[profile.release]
opt-level = 3
lto = true

# The speech-reference regression test (tests/test_speech_reference.rs) runs
# seven pitch analyses over a 10-minute synthetic signal; unoptimized that
# takes many minutes. Optimization does not change f64 results (no fast-math
# in Rust), so parity tests are unaffected.
[profile.test]
opt-level = 2
